[package]
name = "fin"
version = "0.1.0"
edition = "2021"
authors = ["vaibhav"]
license = "GPL-3.0-or-later"
description = "Institutional fundamental equity ranking system (research/report generator, CPU-only)"

[[bin]]
name = "fin-data"
path = "src/main.rs"

[[bin]]
name = "fin-fetch"
path = "src/fetch.rs"

[dependencies]
parquet = "55"
arrow = "55"
rayon = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
indicatif = "0.17"
futures = "0.3"
zip = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
